{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'main/images/favicon.ico' %}">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}" />
  </head>
  <body>
    <header>
      <nav class="container">
        <ul class="nav-list">
          <li>
            <a href="{% url 'home' %}" class="logo-link">
              <img src="{% static 'main/images/logo.svg' %}" />
            </a>
          </li>
          <li>
            <a href="{% url 'about' %}" class="">About</a>
          </li>
          <li>
            <a href="{% url 'blog' %}" class="">Blog</a>
          </li>
          <li>
            <i class="fa-solid fa-users"></i>
            <a href="{% url 'admin:index' %}" class="">Admin</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      {% block content %}
      {% endblock %}
    </main>
    <footer class="dark-bg">
      <div class="container">
        <div class="footer-inner">
          <a href="{% url 'home' %}" class="logo-link">
            <img src="{% static 'main/images/logo.svg' %}" />
          </a>
          <p>&copy; {% now "Y" %}. All rights reserved.</p>
          <div class="footer-dev">
            <p>Developed by </p>
            <a href="https://github.com/Maria-ukr">Maria</a>
          </div>
        </div>
      </div>
    </footer>
    <script defer src="{% static 'main/js/main.js' %}"></script>
  </body>
</html>
